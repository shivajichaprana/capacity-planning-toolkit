# What a change to this repository has to survive.
#
# The jobs are split by what they would TELL you rather than by which tool
# runs them. Arithmetic that changed, a type contract that no longer holds, a
# style contract that no longer holds, and an analysis module that has quietly
# acquired a dependency on the cloud SDK are four different repairs -- and one
# job running all four reports only the first.
#
# Actions are pinned to a commit, not to a tag. A tag is a moving reference the
# publisher can repoint, so a pinned tag is a supply chain that changes without
# a commit here; the readable version is in the comment beside each one.
name: capacity-planning-toolkit-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push supersedes the first: the only run worth finishing is the one
# that describes the current tip.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # The models. Run on the floor and the ceiling of the supported range,
  # because the arithmetic here is floating point and the suite asserts exact
  # closed-form identities: a runtime that evaluates them differently is
  # something this project needs to know about rather than discover.
  # ---------------------------------------------------------------------------
  model-tests:
    name: model tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject declares; the ceiling is the current
        # release line.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project and its check dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run the suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest

  # ---------------------------------------------------------------------------
  # Typing. The settings in pyproject are strict -- every definition is
  # annotated, and an ignore that stops being necessary is an error -- so this
  # job is the thing that keeps an Optional from being read as a float.
  # Measurements are routinely absent in this codebase: a percentile of one
  # sample, an autocorrelation of a flat series, a ceiling with no budget. Each
  # of those is None, and every None is a decision the caller has to make.
  # ---------------------------------------------------------------------------
  typing:
    name: typing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project and its check dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: mypy
        run: python -m mypy ingest models recommend reports tests conftest.py
      - name: Every declared package is actually type checked
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import re
          import sys

          workflow = pathlib.Path(".github/workflows/ci.yml").read_text(encoding="utf-8")
          checked = set(re.findall(r"python -m mypy ([^\n]+)", workflow)[0].split())

          declared = set(
              re.findall(
                  r'packages = \[([^\]]+)\]',
                  pathlib.Path("pyproject.toml").read_text(encoding="utf-8"),
              )[0].replace('"', "").replace(",", " ").split()
          )
          missing = sorted(declared - checked)
          if missing:
              sys.exit("declared in pyproject but not type checked: " + ", ".join(missing))
          print("type checked:", " ".join(sorted(checked)))
          PY

  # ---------------------------------------------------------------------------
  # Style. The contract lives in setup.cfg so that the editor, the command
  # line and this job cannot disagree about the line length.
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project and its check dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: flake8
        run: python -m flake8
      - name: Every committed module compiles
        run: |
          set -euo pipefail
          git ls-files '*.py' | xargs -r python -m py_compile
          echo "compiled: $(git ls-files '*.py' | wc -l) file(s)"

  # ---------------------------------------------------------------------------
  # The dependency boundary, checked by installing nothing.
  #
  # The ingestion layer talks to an API; the store, the models, the
  # recommendation and the renderer do not, and that separation is what lets a
  # capacity review be re-derived from a store file on a laptop with no
  # credentials. The boundary is easy to lose by accident -- one convenience
  # import of the SDK at module scope -- and nothing else here would notice,
  # because every other job installs the SDK. So this job installs nothing at
  # all and imports the analysis layer on a bare interpreter.
  # ---------------------------------------------------------------------------
  analysis-imports:
    name: analysis layer imports without the SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Confirm the SDK really is absent
        run: |
          set -euo pipefail
          if python -c "import boto3" 2>/dev/null; then
            echo "boto3 is installed, so this job proves nothing"
            exit 1
          fi
          echo "boto3 absent, as this job requires"
      - name: Import every module on a bare interpreter
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib
          import sys

          # The ingestion modules are included deliberately: they may build a
          # client lazily, but importing one must not require the SDK either,
          # or a store-only command line cannot even parse its arguments.
          modules = [
              "ingest.store",
              "ingest.runtime",
              "ingest.cloudwatch",
              "ingest.cost",
              "models.seasonality",
              "models.forecast",
              "models.queueing",
              "models.saturation",
              "recommend.headroom",
              "recommend.whatif",
              "reports.review",
          ]
          for name in modules:
              importlib.import_module(name)
              print("imported", name)
          if "boto3" in sys.modules:
              sys.exit("the SDK was imported at module scope by one of the above")
          print("the analysis layer needs nothing but the standard library")
          PY

  # ---------------------------------------------------------------------------
  # One required check to protect the branch with. When a job is added above,
  # add it here too. `always()` matters: without it a cancelled or skipped
  # dependency leaves this job skipped, which several interfaces read as
  # passing.
  # ---------------------------------------------------------------------------
  ci:
    name: ci complete
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - model-tests
      - typing
      - lint
      - analysis-imports
    if: always()
    steps:
      - name: Report the state of every gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          failed = sorted(name for name, job in results.items() if job.get("result") != "success")
          for name in sorted(results):
              print("{:>12}  {}".format(results[name].get("result"), name))
          if failed:
              sys.exit("not successful: " + ", ".join(failed))
          print("every gate passed")
          PY
