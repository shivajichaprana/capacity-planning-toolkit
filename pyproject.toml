[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capacity-planning-toolkit"
version = "0.1.0"
description = "Capacity and headroom analysis: demand forecasting, saturation modelling, scaling recommendations"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "boto3>=1.34,<2",
  "botocore>=1.34,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "mypy>=1.8",
  "flake8>=7.0",
  "boto3-stubs[cloudwatch,ce]>=1.34",
]

[tool.setuptools]
packages = ["ingest", "models", "recommend"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["botocore.*", "boto3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]
